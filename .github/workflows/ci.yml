name: DocChat CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      MONGOMS_VERSION: "8.2.6"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Lint Express and its tests
        run: npm exec --yes --package=eslint@10.15.0 -- eslint --max-warnings=0 src test
      - run: npm test

  ai-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install CPU dependencies and Ruff
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          python -m pip install -r requirements.txt ruff==0.14.14
          python -m pip check
      - run: python -m ruff check --select E4,E7,E9,F app tests eval
      - run: python -m pytest -q tests eval
        env:
          HF_HUB_OFFLINE: "1"
