name: docchat
services:
  ai-service:
    build: ./ai-service
    init: true
    env_file: ["${DOCCHAT_AI_ENV:-./ai-service/.env}"]
    environment:
      PORT: "8000"
    ports: ["127.0.0.1:8000:8000"]
    develop:
      watch:
        - { action: rebuild, path: ./ai-service/app }
        - { action: rebuild, path: ./ai-service/requirements.txt }

  server:
    build: ./server
    init: true
    env_file: ["${DOCCHAT_SERVER_ENV:-./server/.env}"]
    environment:
      PORT: "5000"
      AI_URL: http://ai-service:8000
      CLIENT_URL: http://localhost:5173
      TRUST_PROXY_HOPS: "0"
    ports: ["127.0.0.1:5000:5000"]
    depends_on:
      ai-service: { condition: service_healthy }
    develop:
      watch:
        - { action: rebuild, path: ./server/src }
        - { action: rebuild, path: ./server/package.json }
        - { action: rebuild, path: ./server/package-lock.json }

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    init: true
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      server: { condition: service_healthy }
    develop:
      watch:
        - { action: rebuild, path: ./client/src }
        - { action: rebuild, path: ./client/public }
        - { action: rebuild, path: ./client/index.html }
        - { action: rebuild, path: ./client/vite.config.js }
        - { action: rebuild, path: ./client/nginx.conf }
        - { action: rebuild, path: ./client/package.json }
        - { action: rebuild, path: ./client/package-lock.json }
